version: 2
updates:
  # GitHub Actions ecosystem — re-enabled 2026-06-09 after the
  # repo flipped to public. The original plan-tier rationale
  # (see docs/maintenance/2026-06-08-plan-limits-blockers.md)
  # no longer applies: on public repos, macOS-15 runners are
  # available without a Pro upgrade. If Dependabot's auto-PRs
  # start failing CI again with a plan-tier error, the right
  # fix is to enable branch protection + required CI checks
  # (so the PR is gated on green) rather than re-pausing
  # the ecosystem.
  #
  # `open-pull-requests-limit: 5` is the default; the cap
  # exists so a flood of stale action bumps doesn't bury
  # real PRs in the queue.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      github-actions-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Swift ecosystem — kept paused. Structural reasons, not
  # plan-tier:
  # 1. Dependabot looks for Package.swift / Package.resolved
  #    at the directory it scans. Our SPM manifest lives in
  #    SmartChatApp.xcodeproj/project.xcworkspace/xcshareddata/
  #    swiftpm/Package.resolved (Xcode's internal location),
  #    so every Dependabot run errors with:
  #      dependency_file_not_found: No files found in /,
  #      file-path: null
  #    Dependabot has no config to point at a different
  #    manifest path.
  # 2. Even if Dependabot could find Package.resolved, our
  #    SPM deps are versioned in project.yml's `packages:`
  #    block (the path-linked OpenClawKit plus 8 URL-pinned
  #    libraries); bumping Package.resolved doesn't change
  #    the project — you'd need a project.yml edit +
  #    xcodegen regenerate, which is a human-driven change
  #    anyway.
  #
  # To re-enable: when SPM moves to a top-level
  # Package.swift (a refactor in its own right), change
  # `open-pull-requests-limit: 0` to `5` and update the
  # documentation here.
  - package-ecosystem: "swift"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0
    # SwiftPM updates can break iOS-targeted APIs without
    # warning (MarkdownDisplayView / swiftui-math are tightly
    # coupled to specific SwiftUI versions). Group minor+patch
    # together so a single PR surfaces the full transitive
    # update set; ignore major bumps so they need explicit
    # human action.
    groups:
      swift-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
