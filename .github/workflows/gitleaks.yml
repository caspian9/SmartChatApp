name: gitleaks

# Second-line defense against accidentally committed secrets.
# GitHub's built-in secret scanning (see Settings → Code security)
# is the primary defense; this workflow runs gitleaks against every
# push and PR as a redundant check, with rules that include
# patterns GitHub's scanner doesn't cover (e.g., custom patterns
# in CLAUDE.md / project config).
#
# The runner is ubuntu-latest because gitleaks is a Go binary and
# doesn't need macOS. This saves runner minutes vs. running on
# macos-15 alongside the iOS workflows.
#
# Gitleaks v8.30.1 (matches the version we run locally; the
# manifest lives in the project's docs/ for reproducibility).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    name: Scan for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # Full history so a secret squashed in the current commit
          # but present in a past commit is still caught. For
          # very large repos this can be slow; the SmartChatApp
          # repo is small enough that fetch-depth: 0 is fine.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          # The action's default config (.gitleaks.toml at repo
          # root) is fine for this repo — we don't ship a custom
          # config. GITHUB_TOKEN is provided by the action itself
          # for posting the SARIF results back to the Security
          # tab; the action docs say to forward it explicitly.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
