name: CodeQL

on:
  push:
    branches: [main]
  schedule:
    # Daily 06:00 UTC scan, gated by a `should-scan` job (below)
    # that only forwards to the heavy `analyze` job if no
    # CodeQL run succeeded in the past 24 hours. The intent:
    # ensure CodeQL runs at most once per 24h window, regardless
    # of how many pushes happen. Push-triggered CodeQL runs
    # are NOT throttled by this gate (they're the canonical
    # "run on every push" path) — only schedule-triggered runs
    # check the 24h window.
    - cron: "0 6 * * *"

permissions:
  # CodeQL needs read-only access to the repo for checkout +
  # write access to the Security tab for the alerts view.
  contents: read
  security-events: write
  # `actions: read` is needed for the `should-scan` job to call
  # the GitHub Actions API and inspect past CodeQL run history.
  actions: read

jobs:
  # Cheap ubuntu gate that decides whether the heavy macos-15
  # analyze job should run. Push events are always forwarded
  # (immediate CodeQL feedback on every main push). Schedule
  # events check whether any CodeQL run succeeded in the past
  # 24 hours via the GitHub Actions API; if so, skip — the
  # push path already covered the recent code.
  should-scan:
    name: Should scan (24h CodeQL dedup gate)
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.check.outputs.should-run }}
    steps:
      - name: Decide whether to forward to the heavy analyze job
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Push-triggered runs are always forwarded — immediate
          # CodeQL feedback on every main push is the canonical
          # "this PR / direct push may have introduced an alert"
          # path. The 24h dedup gate is schedule-only.
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "should-run=true" >> "$GITHUB_OUTPUT"
            echo "Push event — running CodeQL."
            exit 0
          fi

          # Schedule events: query the Actions API for CodeQL runs
          # in the past 24h. If any succeeded, skip — the push
          # path already covered recent code. If none succeeded
          # (or all failed), run the analyze job so we get fresh
          # coverage from the schedule path.
          #
          # Why 24h? It's a reasonable upper bound on "is this
          # code stale enough that we want a scheduled rescan".
          # A day of unbroken push activity means the last push
          # already triggered a scan; a quiet weekend means the
          # last scan is at most 24h old at Monday 06:00 UTC.
          #
          # Note: `created_at` filter on the API is RFC3339; the
          # 24h cutoff is computed in shell. The API supports
          # `created=>YYYY-MM-DDTHH:MM:SSZ` query strings, but
          # we filter in shell to keep the date math obvious.
          SINCE=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          echo "Looking for CodeQL runs since ${SINCE}..."

          # Page through runs of THIS workflow (`CodeQL`) — `head
          # #27204229282` style ID — and find any with
          # conclusion=success and created_at > SINCE. Default
          # page size is 30; we ask for the smallest page that
          # covers a day's activity, which is 50.
          RECENT_SUCCESS=$(gh api \
            "${{ github.api_url }}/repos/${{ github.repository }}/actions/runs?workflow_id=$(gh api "${{ github.api_url }}/repos/${{ github.repository }}/actions/workflows/codeql.yml" --jq '.id')&per_page=50&status=completed&conclusion=success" \
            --jq ".workflow_runs[] | select(.created_at > \"${SINCE}\") | .created_at" \
            | head -1)

          if [ -n "$RECENT_SUCCESS" ]; then
            echo "should-run=false" >> "$GITHUB_OUTPUT"
            echo "CodeQL succeeded at ${RECENT_SUCCESS} (within 24h) — skipping."
          else
            echo "should-run=true" >> "$GITHUB_OUTPUT"
            echo "No successful CodeQL run in the past 24h — running."
          fi

  analyze:
    name: Analyze (Swift)
    runs-on: macos-15
    needs: should-scan
    if: needs.should-scan.outputs.should-run == 'true'
    # Bumped 20 → 30 → 60 across the maintenance windows. The
    # cold-cache build + codeql analyze budget on the macos-15
    # runner is ~25-30 min combined. The first run after a
    # workflow edit can tip past 30 (we hit 30:46 in run
    # #36 / 27183042124), so 60 leaves headroom for a worst-
    # case cold cache + slow runner. Subsequent warm-cache
    # runs are 5-10 min total.
    timeout-minutes: 60

    # OPENCLAW_REPO is "owner/name" of the OpenClawKit fork to
    # clone as a sibling before xcodegen runs. Re-pointable via
    # repo or org variable (Settings → Secrets and variables →
    # Actions → Variables); defaults to the upstream fork so
    # existing behavior is preserved. Mirrors ci.yml.
    env:
      OPENCLAW_REPO: ${{ vars.OPENCLAW_REPO || 'caspian9/openclaw' }}

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      # project.yml path-links OpenClawKit from
      # ../openclaw/apps/shared/OpenClawKit, and xcodegen
      # validation runs in the very next step. Without this
      # clone, xcodegen fails with "Invalid local package
      # 'OpenClawKit'". Same step as ci.yml.
      - name: Clone OpenClaw sibling
        run: |
          git clone \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${OPENCLAW_REPO}.git" \
            ../openclaw

      # The openclaw fork and its ElevenLabsKit dependency
      # declare swift-tools-version: 6.2, so the default
      # macos-15 Xcode 16.4 (Swift 6.1) is too old to
      # resolve the dependency graph. Same as ci.yml.
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90  # v1 (= v1.7.0)
        with:
          xcode-version: '26.3'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      # Cache SwiftPM artifacts keyed on Package.resolved. Without
      # this, the xcodebuild preflight below would re-download
      # every Swift package on every run (~5-7 min cold start
      # vs. ~1-2 min with cache). The cache key prefix
      # 'codeql-' keeps this namespace separate from ci.yml's
      # cache so each workflow can have its own warm state.
      - name: Cache SwiftPM artifacts
        id: cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            build/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
          key: ${{ runner.os }}-codeql-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-codeql-spm-

      # Clear any stale SwiftPM artifacts left by previous jobs
      # on this runner, but ONLY when the cache step above
      # didn't restore a matching manifest hash. Half-built
      # caches cause the same "Macro ... must be enabled"
      # false positive that ci.yml's clear step documents.
      - name: Clear stale SwiftPM artifacts (only when manifest changed)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          rm -rf build/SourcePackages
          rm -rf ~/Library/Caches/org.swift.swiftpm
          rm -rf ~/Library/org.swift.swiftpm

      # CodeQL's official Swift support is still in beta (as of
      # 2026). The 'security-and-quality' query suite is the
      # right default — it surfaces the most common bug classes
      # (injection, path traversal, weak crypto) without the
      # noise of the 'security-experimental' pack.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e  # v4

      # CodeQL's Swift extractor hooks into the Swift compiler
      # during a real build. Without this step the analyze
      # step fails with 'CodeQL detected code written in
      # Swift but could not process any of it'. The
      # 'generic/platform=iOS' destination + CODE_SIGNING_ALLOWED=NO
      # matches the simulator path in ci.yml — the produced
      # .app is discarded; CodeQL just needs the compiler
      # to run.
      # Destination was 'generic/platform=iOS' previously; we
      # switched to the simulator destination because (a)
      # 'generic/platform=iOS' compiles the device slice which
      # is significantly slower than the simulator slice
      # (consistent 30+ min cold builds that bumped into the
      # 30-min job timeout — see run #36 / 27183042124), and
      # (b) CodeQL only cares that the Swift compiler runs to
      # extract the AST — it does not need a device slice.
      # The .app produced is discarded.
      - name: Build (for CodeQL extraction)
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme SmartChatApp \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -derivedDataPath build \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e  # v4
        with:
          category: "/language:swift"
