name: CodeQL

on:
  push:
    branches: [main]
  schedule:
    # Daily 06:00 UTC scan, gated by a `should-scan` job (below)
    # that only forwards to the heavy `analyze` job if no
    # CodeQL run succeeded in the past 24 hours. The intent:
    # ensure CodeQL runs at most once per 24h window, regardless
    # of how many pushes happen. Push-triggered CodeQL runs
    # are NOT throttled by this gate (they're the canonical
    # "run on every push" path) — only schedule-triggered runs
    # check the 24h window.
    - cron: "0 6 * * *"
  # Manual re-run path. Matches the ci.yml convention (see
  # ci.yml `on:` block). Useful for: (a) verifying the SDK
  # pin's analyze step is green before merging the PR that
  # introduced the pin, without needing a real push to main;
  # (b) re-running after an intermittent CodeQL failure that
  # was actually a runner flake (the `should-scan` dedup
  # gate treats schedule+push identically — only manual
  # runs are also forwarded unconditionally, since the
  # human pressing the button has already opted in).
  workflow_dispatch:

permissions:
  # CodeQL needs read-only access to the repo for checkout +
  # write access to the Security tab for the alerts view.
  contents: read
  security-events: write
  # `actions: read` is needed for the `should-scan` job to call
  # the GitHub Actions API and inspect past CodeQL run history.
  actions: read

jobs:
  # Cheap ubuntu gate that decides whether the heavy macos-15
  # analyze job should run. Looks at the most recent CodeQL
  # run on main and forwards to `analyze` unless that run is
  # either (a) still in progress, or (b) a success that
  # completed within the past 24 hours. Both push and
  # schedule triggers go through this gate — the intent is
  # "CodeQL runs at most once per 24h window" regardless of
  # how many pushes happen.
  should-scan:
    name: Should scan (24h CodeQL dedup gate)
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.check.outputs.should-run }}
    steps:
      - name: Decide whether to forward to the heavy analyze job
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Manual dispatches bypass the 24h dedup gate: the
          # human pressing the button has already opted in to
          # burning the 25-30 min analyze budget. Bail early
          # before any API call so the gate is auditable as
          # "always forwards when event_name == workflow_dispatch".
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should-run=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch — running."
            exit 0
          fi

          # For push/schedule events, look at the most recent
          # CodeQL run on main. We only need the single newest
          # run — the dedup decision is based on its analyze
          # job conclusion / age, not on the full 24h run
          # history. Reading per_page=1 is cheaper than walking
          # all 50 results and filtering.
          #
          # Branch filter: defensively restrict to main even
          # though the current `on: push: branches: [main]`
          # trigger can't produce runs on other branches. Cheap
          # insurance against a future trigger change.
          #
          # The decision tree (push / schedule only):
          #   1. No run found at all              → run
          #   2. Latest run still in progress
          #      (queued / in_progress / waiting) → skip
          #   3. Latest Analyze job SUCCEEDED
          #      within the past 24h              → skip
          #   4. Anything else: latest Analyze job
          #      was SKIPPED (no real analyze ran
          #      on record), FAILED, cancelled,
          #      timed out, or the success is
          #      already > 24h old                → run
          #
          # Note: `created_at` strings sort lexicographically
          # because they're RFC3339 (e.g. 2026-06-10T08:00:00Z),
          # so shell string comparison gives the right
          # chronological answer without date math.
          #
          # Why the Analyze job conclusion matters (and not the
          # workflow-level conclusion): when the gate forwards
          # `should-run=false`, the workflow run still finishes
          # with overall `conclusion=success` (because the gate
          # job itself succeeded). Reading the workflow-level
          # conclusion therefore conflates "real analyze ran and
          # passed" with "no analyze ran at all", and the 24h
          # dedup compounds on top — every push within 24h of
          # the first skip gets skipped forever. Reading the
          # Analyze job's own conclusion fixes this. Observed
          # in the wild on 2026-07-13: 4 push-triggered runs in
          # 13 s all hit this compound-skip bug; only run
          # #29225367286 (whose should-scan returned "latest
          # analyze was skipped" by coincidence) actually
          # executed analyze.
          WORKFLOW_ID=$(gh api \
            "${{ github.api_url }}/repos/${{ github.repository }}/actions/workflows/codeql.yml" \
            --jq '.id')

          LATEST=$(gh api \
            "${{ github.api_url }}/repos/${{ github.repository }}/actions/runs?workflow_id=${WORKFLOW_ID}&branch=main&per_page=1" \
            --jq '.workflow_runs[0] // empty')

          if [ -z "$LATEST" ]; then
            echo "should-run=true" >> "$GITHUB_OUTPUT"
            echo "No CodeQL run found — running."
            exit 0
          fi

          LATEST_STATUS=$(echo "$LATEST" | jq -r '.status')
          LATEST_CREATED=$(echo "$LATEST" | jq -r '.created_at')
          LATEST_ID=$(echo "$LATEST" | jq -r '.id')
          SINCE=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)

          # Case 2: still running. status is one of queued /
          # in_progress / requested / waiting / pending for
          # not-yet-finished runs. Any value other than
          # "completed" means we should defer.
          if [ "$LATEST_STATUS" != "completed" ]; then
            echo "should-run=false" >> "$GITHUB_OUTPUT"
            echo "Latest CodeQL run is ${LATEST_STATUS} — skipping."
            exit 0
          fi

          # Query the Analyze (Swift) job's own conclusion.
          # `head -1` defends against jq emitting extra blank
          # lines for some reason; `.name == "Analyze (Swift)"`
          # is the only "Analyze (Swift)" job in this workflow.
          ANALYZE_CONCLUSION=$(gh api \
            "${{ github.api_url }}/repos/${{ github.repository }}/actions/runs/${LATEST_ID}/jobs" \
            --jq '.jobs[] | select(.name == "Analyze (Swift)") | .conclusion' \
            | head -1)
          echo "Latest CodeQL run on main: id=${LATEST_ID} created=${LATEST_CREATED} analyze=${ANALYZE_CONCLUSION:-<absent>}"
          echo "24h cutoff: ${SINCE}"

          # Case 3: real Analyze job succeeded within 24h. The
          # string `>` does lexicographic compare, which works
          # because RFC3339 sorts the same way as time.
          if [ "$ANALYZE_CONCLUSION" = "success" ] && [ "$LATEST_CREATED" \> "$SINCE" ]; then
            echo "should-run=false" >> "$GITHUB_OUTPUT"
            echo "Latest Analyze job succeeded within 24h — skipping."
            exit 0
          fi

          # Case 4: Analyze job was SKIPPED (gate forwarded
          # false, so no real analyze ran on record — burning
          # this run is what un-stucks the gate), FAILED,
          # cancelled, timed out, OR a success that's already
          # > 24h old. Either way the dedup gate is open.
          echo "should-run=true" >> "$GITHUB_OUTPUT"
          echo "Latest Analyze job is ${ANALYZE_CONCLUSION:-<absent>} (or > 24h old) — running."

  analyze:
    name: Analyze (Swift)
    runs-on: macos-15
    needs: should-scan
    if: needs.should-scan.outputs.should-run == 'true'
    # Bumped 20 → 30 → 60 across the maintenance windows. The
    # cold-cache build + codeql analyze budget on the macos-15
    # runner is ~25-30 min combined. The first run after a
    # workflow edit can tip past 30 (we hit 30:46 in run
    # #36 / 27183042124), so 60 leaves headroom for a worst-
    # case cold cache + slow runner. Subsequent warm-cache
    # runs are 5-10 min total.
    timeout-minutes: 60

    # OPENCLAW_REPO is "owner/name" of the OpenClawKit repo to
    # clone as a sibling before xcodegen runs. OPENCLAW_REF pins
    # the git ref (tag / branch / SHA) to check out — both default
    # to upstream values so the workflow doesn't drift with fork
    # activity. Both are re-pointable via repo or org variables
    # (Settings → Secrets and variables → Actions → Variables).
    #
    # Why pin to upstream `openclaw/openclaw@v2026.5.28` (instead
    # of the fork's `main` HEAD, as we did before):
    #   - The fork's `main` HEAD on 2026-07-09 introduced an actor-
    #     isolation pattern in ChatTranscriptCache.swift (lines
    #     1032 & 1050 — `defer { ... self.execute(db, ...) }`)
    #     that Xcode 26.3's strict-concurrency checker flags as
    #     `sending 'db' risks causing data races`. The app does not
    #     call this class (we use MessageCacheStore), but `swiftc`
    #     type-checks every file in the SDK module, so a single
    #     bad file fails the whole build. This caused the 2026-07-13
    #     CodeQL failure on the `fix(settings): replace system
    #     .alert with in-hierarchy overlay` push (run #29225367286,
    #     exit 65 from Build step).
    #   - v2026.5.28 (commit e932160, 2026-05-30) is the same SDK
    #     that builds locally — verified via `git describe --tags`
    #     on /Users/hai/Code/openclaw. Upstream's tag dereferences
    #     to e932160, identical to the fork's HEAD on 2026-05-30.
    #   - Local builds (with stable Xcode) succeed on either ref;
    #     only the GitHub Actions runner (Xcode 26.3) trips the
    #     check. The local-vs-CI divergence is the whole reason
    #     this pin exists. Mirrors the ci.yml pin from PR #58.
    #
    # When the SDK's concurrency issue is fixed upstream (or in
    # the fork's `main`), delete the OPENCLAW_REF variable (or set
    # it to `main`) and revert OPENCLAW_REPO to `caspian9/openclaw`
    # to resume tracking the fork.
    env:
      OPENCLAW_REPO: ${{ vars.OPENCLAW_REPO || 'openclaw/openclaw' }}
      OPENCLAW_REF: ${{ vars.OPENCLAW_REF || 'v2026.5.28' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # project.yml path-links OpenClawKit from
      # ../openclaw/apps/shared/OpenClawKit, and xcodegen
      # validation runs in the very next step. Without this
      # clone, xcodegen fails with "Invalid local package
      # 'OpenClawKit'". Owner + ref are parameterized via
      # OPENCLAW_REPO and OPENCLAW_REF env (defaults: upstream
      # openclaw/openclaw @ v2026.5.28). `--depth 1` keeps the
      # clone fast; we only need the resolved tree at
      # OPENCLAW_REF, not history. `--branch` accepts a tag /
      # branch / full SHA. Same step as ci.yml.
      - name: Clone OpenClaw sibling
        run: |
          git clone \
            --branch "${OPENCLAW_REF}" \
            --depth 1 \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${OPENCLAW_REPO}.git" \
            ../openclaw

      # The openclaw fork and its ElevenLabsKit dependency
      # declare swift-tools-version: 6.2, so the default
      # macos-15 Xcode 16.4 (Swift 6.1) is too old to
      # resolve the dependency graph. Same as ci.yml.
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90  # v1 (= v1.7.0)
        with:
          xcode-version: '26.3'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      # Cache SwiftPM artifacts keyed on Package.resolved. Without
      # this, the xcodebuild preflight below would re-download
      # every Swift package on every run (~5-7 min cold start
      # vs. ~1-2 min with cache). The cache key prefix
      # 'codeql-' keeps this namespace separate from ci.yml's
      # cache so each workflow can have its own warm state.
      - name: Cache SwiftPM artifacts
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            build/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
          key: ${{ runner.os }}-codeql-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-codeql-spm-

      # Clear any stale SwiftPM artifacts left by previous jobs
      # on this runner, but ONLY when the cache step above
      # didn't restore a matching manifest hash. Half-built
      # caches cause the same "Macro ... must be enabled"
      # false positive that ci.yml's clear step documents.
      - name: Clear stale SwiftPM artifacts (only when manifest changed)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          rm -rf build/SourcePackages
          rm -rf ~/Library/Caches/org.swift.swiftpm
          rm -rf ~/Library/org.swift.swiftpm

      # CodeQL's official Swift support is still in beta (as of
      # 2026). The 'security-and-quality' query suite is the
      # right default — it surfaces the most common bug classes
      # (injection, path traversal, weak crypto) without the
      # noise of the 'security-experimental' pack.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3  # v4

      # CodeQL's Swift extractor hooks into the Swift compiler
      # during a real build. Without this step the analyze
      # step fails with 'CodeQL detected code written in
      # Swift but could not process any of it'. The
      # 'generic/platform=iOS' destination + CODE_SIGNING_ALLOWED=NO
      # matches the simulator path in ci.yml — the produced
      # .app is discarded; CodeQL just needs the compiler
      # to run.
      # Destination was 'generic/platform=iOS' previously; we
      # switched to the simulator destination because (a)
      # 'generic/platform=iOS' compiles the device slice which
      # is significantly slower than the simulator slice
      # (consistent 30+ min cold builds that bumped into the
      # 30-min job timeout — see run #36 / 27183042124), and
      # (b) CodeQL only cares that the Swift compiler runs to
      # extract the AST — it does not need a device slice.
      # The .app produced is discarded.
      - name: Build (for CodeQL extraction)
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme SmartChatApp \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -derivedDataPath build \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3  # v4
        with:
          category: "/language:swift"
