name: CI

# Minimum token scope for the build/test job: only `contents: read` is
# required. Setting this explicitly avoids the default broad grants
# (notably `contents: write` on private repos) and ensures a future
# step that accidentally needs write will fail loudly at review time.
permissions:
  contents: read

on:
  # pull_request has NO paths filter — the trigger fires for every
  # PR, including docs-only ones. The detect-changes job (below)
  # checks whether the PR touched any code/build-config file and
  # gates the macos-15 build matrix on that signal. docs-only
  # PRs get green "skipped" check-runs (branch protection treats
  # skipped as passing) without spending the 30-minute macos-15
  # build.
  #
  # The previous design used a paths: filter on pull_request and
  # a manual workflow_dispatch workaround for docs-only PRs.
  # That was broken: dispatched check-runs are not PR-associated,
  # so branch protection's required-check UI showed "Expected —
  # Waiting for status to be reported" even when the checks had
  # actually succeeded (observed on PR #24, 2026-06-25). Keeping
  # the workflow_dispatch trigger as an emergency manual re-run
  # path — it always runs the full build via the OR clause in
  # `build.if` below.
  pull_request:
    branches: [main]
  workflow_dispatch:
  push:
    branches: [main]

# Note: concurrency moved to job level (see `build.concurrency` below).
# Workflow-level concurrency can't see the matrix dimension, so
# the group key resolves to the same empty string for all matrix
# slots and they collide. Job-level concurrency has the matrix
# in scope.

jobs:
  # Path-detection gate. Runs on ubuntu (cheap, ~10-20s) and
  # produces a single output `code` = 'true' if the PR changed
  # any code/build-config file, 'false' otherwise. The macos-15
  # build job below uses this to decide whether to run.
  #
  # Skip for non-PR events (push to main, workflow_dispatch):
  # those should always run the full build, and the OR clause
  # in `build.if` short-circuits to true for them.
  #
  # Maintenance tip: when adding a new top-level source dir,
  # add it to the `code` filter below. Until then, PRs that
  # ONLY touch files in the new dir will not trigger the
  # macos-15 build. (The pull_request trigger itself no longer
  # has a paths: filter — every PR fires this workflow.)
  # The current paths match the directory layout documented in
  # CLAUDE.md.
  detect-changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0  # paths-filter needs git history to diff against base

      - id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706  # v4.0.2
        with:
          base: ${{ github.event.pull_request.base.sha }}
          filters: |
            code:
              - 'SmartChatApp/**'
              - 'SmartChatAppTests/**'
              - 'project.yml'
              - 'Package.resolved'
              - 'Makefile'
              - 'config/**'
              - 'scripts/**'
              - '.github/workflows/**'

  build:
    name: Build & Test (${{ matrix.destination.label }})
    needs: detect-changes
    # For pull_request: run the macos-15 build only if the PR
    # changed any code/build-config file (detect-changes output
    # `code == 'true'`). For push to main and workflow_dispatch:
    # always run (the event_name check wins via the OR clause).
    #
    # A skipped job reports its check-run with conclusion
    # "skipped", which GitHub treats as passing for branch
    # protection. That's the whole point of this design:
    # docs-only PRs satisfy the required checks without burning
    # the 30-minute macos-15 build.
    if: |
      github.event_name != 'pull_request' ||
      needs.detect-changes.outputs.code == 'true'
    runs-on: macos-15
    timeout-minutes: 30  # bumped from 25 to absorb the matrix
    # Job-level concurrency has the matrix dimension in scope, so
    # the group key differs per destination and the slots don't
    # collide. Workflow-level concurrency can't see matrix.* — the
    # parser rejects it ("Unrecognized named-value: 'matrix'"), which
    # is the cause of the 0-second empty-jobs failure we've been
    # seeing on every push since the matrix commit.
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.ref }}-${{ matrix.destination.name }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    strategy:
      fail-fast: false  # see the per-destination result
      matrix:
        destination:
          - name: "iPhone 17 Pro"
            label: "iOS 18 (latest)"
          # iPhone 17 (non-Pro) is the second matrix slot. Earlier
          # iterations used iPhone 16 (run #27193610858 — dropped
          # from the macos-15 runner's simulator catalog after
          # iOS 26 SDK) and iPhone 16e (run #27194034590 — also
          # absent from the runner). iPhone 17 is the 2025 base
          # model, shares the A19 chip class with iPhone 17 Pro,
          # and is in the same simulator catalog we already use
          # as the "latest" slot. The label stays "iOS 18
          # (penultimate)" so branch protection's required check
          # name (Build & Test (iOS 18 (penultimate))) keeps
          # matching.
          - name: "iPhone 17"
            label: "iOS 18 (penultimate)"

    # OPENCLAW_REPO is "owner/name" of the OpenClawKit fork to clone
    # as a sibling before xcodegen runs. Re-pointable via repo or org
    # variable (Settings → Secrets and variables → Actions → Variables);
    # defaults to the upstream fork so existing behavior is preserved.
    env:
      OPENCLAW_REPO: ${{ vars.OPENCLAW_REPO || 'caspian9/openclaw' }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      # project.yml references OpenClawKit as a path-linked package
      # (../openclaw/apps/shared/OpenClawKit). Check out the openclaw
      # fork as a sibling so the relative path resolves. actions/checkout
      # refuses paths outside the workspace, so we git clone directly
      # using the runner's GITHUB_TOKEN. Owner is parameterized via the
      # OPENCLAW_REPO env (default: caspian9/openclaw) so fork PRs can
      # re-point to a different fork without editing the workflow file.
      - name: Clone OpenClaw sibling
        run: |
          git clone \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${OPENCLAW_REPO}.git" \
            ../openclaw

      # The openclaw fork and its ElevenLabsKit dependency declare
      # swift-tools-version: 6.2, but the default macos-15 runner
      # only ships Swift 6.1 (Xcode 16.4). Install a newer Xcode that
      # bundles Swift 6.2+ so xcodebuild can resolve the full
      # dependency graph.
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90  # v1 (= v1.7.0)
        with:
          xcode-version: '26.3'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      # Inject the Apple-mandated CFBundleVersion (monotonic int) before
      # any xcodebuild step. github.run_number is a per-workflow-run
      # counter that satisfies App Store Connect's "must be greater than
      # the previous build" rule.
      #
      # The script is idempotent: when the resolved values match what's
      # already in .local-version.xcconfig, it skips the write so the
      # mtime (and Xcode's incremental-build cache) stays stable.
      - name: Inject build number + git SHA
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: bash scripts/inject-build-timestamp.sh

      # Cache SwiftPM artifacts keyed on Package.resolved. Subsequent
      # PRs that don't touch the manifest skip the cold-start (~60-90s
      # saved on iOS builds). Cache is restored BEFORE the clear step
      # below; if the manifest hash matches a previous run, the clear
      # is skipped via the cache-hit output gate.
      - name: Cache SwiftPM artifacts
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            build/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      # Clear any stale SwiftPM artifacts left by previous jobs on this
      # runner, but ONLY when the cache step above didn't restore a
      # matching manifest hash. The TCA / swift-perception / swift-case-
      # paths macro plugins are sensitive to having a half-built cache:
      # when their .build directories exist but the macro executable
      # wasn't produced in the current toolchain, xcodebuild reports
      # "Macro ... must be enabled before it can be used". A clean
      # source-packages checkout is the only reliable fix — but only
      # when the manifest actually changed.
      - name: Clear stale SwiftPM artifacts (only when manifest changed)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          rm -rf build/SourcePackages
          rm -rf ~/Library/Caches/org.swift.swiftpm
          rm -rf ~/Library/org.swift.swiftpm

      # -skipMacroValidation works around a false-positive
      # "Macro ... must be enabled before it can be used" graph error
      # that xcodebuild emits on Xcode 26.3 for TCA's macro plugins
      # (ComposableArchitectureMacros, CasePathsMacros, etc.) when the
      # resolved swift-syntax version is ahead of the toolchain's
      # internal expectations. The macros themselves are trusted
      # (TCA, CasePaths, swift-perception, swift-dependencies are all
      # well-known pointfreeco packages), so the security caveat in
      # the flag's help text does not apply.
      #
      # GCC_TREAT_WARNINGS_AS_ERRORS=YES turns any compiler warning
      # into a build failure. Cheap ABI / deprecation catch — the
      # project is pre-1.0 so the warning surface is small enough
      # that the gate is mostly a "don't ship a new deprecation"
      # guard. Per docs/maintenance/2026-06-08-github-maintenance-
      # review.md item #43.
      #
      # CI runs the simulator path with CODE_SIGNING_ALLOWED=NO,
      # so the Team ID isn't needed here. The release.yml
      # workflow (tag-driven, runs on .archive) does need it;
      # it consumes IOS_DEVELOPMENT_TEAM from a repo secret
      # with auto-detect fallback via scripts/ios-team-id.sh.
      # See the Makefile comment block for the full override
      # contract.
      - name: Build (iOS Simulator)
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme SmartChatApp \
            -destination "platform=iOS Simulator,name=${{ matrix.destination.name }}" \
            -derivedDataPath build \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            GCC_TREAT_WARNINGS_AS_ERRORS=YES \
            build

      - name: Test (iOS Simulator)
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme SmartChatApp \
            -destination "platform=iOS Simulator,name=${{ matrix.destination.name }}" \
            -derivedDataPath build \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            GCC_TREAT_WARNINGS_AS_ERRORS=YES

      # Upload the raw Xcode test report as a workflow artifact
      # so a future debugging session can open it in Xcode and
      # see per-test results, screenshots, and console output.
      # 30-day retention matches release.yml's .xcarchive.
      - name: Upload .xcresult
        if: always()  # upload on test failure too — that's when you need it most
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: SmartChatApp-xcresult-${{ matrix.destination.name }}
          path: build/Logs/Test/*.xcresult
          if-no-files-found: warn
          retention-days: 30

  # When the `build` matrix above is skipped (docs-only PR),
  # its check-run is reported under the matrix TEMPLATE name
  # (`Build & Test (${{ matrix.destination.label }})`), not the
  # two matrix-EXPANDED names that branch protection requires
  # (`Build & Test (iOS 18 (latest))` and `Build & Test (iOS 18
  # (penultimate))`). The template name doesn't match either
  # required check, so the PR is BLOCKED even though the build
  # was correctly skipped.
  #
  # This job fixes that by explicitly emitting check-runs with
  # the matrix-expanded names for docs-only PRs. It runs on
  # ubuntu (cheap, ~5s per matrix slot) and uses the SAME
  # `name:` template + SAME matrix labels as `build`, so each
  # child creates a check-run with exactly the name branch
  # protection requires. The status is `success` (no-op step),
  # which satisfies the required check.
  #
  # Skipped for non-PR events (push to main, workflow_dispatch)
  # because `detect-changes` is skipped for those and
  # `outputs.code` is empty — the condition would erroneously
  # treat that as "docs-only". For non-PR events the regular
  # `build` matrix handles everything.
  docs-check-status:
    name: Build & Test (${{ matrix.destination.label }})
    needs: detect-changes
    if: |
      github.event_name == 'pull_request' &&
      needs.detect-changes.outputs.code == 'false'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        destination:
          - name: "iPhone 17 Pro"
            label: "iOS 18 (latest)"
          - name: "iPhone 17"
            label: "iOS 18 (penultimate)"
    steps:
      - name: No-op (docs-only PR)
        run: |
          echo "Docs-only PR — matrix `build` was skipped."
          echo "Emitting matrix-expanded check-run with SUCCESS status"
          echo "to satisfy branch protection's required check names."
