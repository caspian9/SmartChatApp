name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Test
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # project.yml references OpenClawKit as a path-linked package
      # (../openclaw/apps/shared/OpenClawKit). Check out the openclaw
      # fork as a sibling so the relative path resolves. actions/checkout
      # refuses paths outside the workspace, so we git clone directly
      # using the runner's GITHUB_TOKEN.
      - name: Clone OpenClaw sibling
        run: |
          git clone \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/caspian9/openclaw.git" \
            ../openclaw

      # The openclaw fork and its ElevenLabsKit dependency declare
      # swift-tools-version: 6.2, but the default macos-15 runner
      # only ships Swift 6.1 (Xcode 16.4). Install a newer Xcode that
      # bundles Swift 6.2+ so xcodebuild can resolve the full
      # dependency graph.
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      # Clear any stale SwiftPM artifacts left by previous jobs on this
      # runner. The TCA / swift-perception / swift-case-paths macro
      # plugins are sensitive to having a half-built cache: when their
      # .build directories exist but the macro executable wasn't produced
      # in the current toolchain, xcodebuild reports "Macro ... must be
      # enabled before it can be used". A clean source-packages checkout
      # is the only reliable fix.
      - name: Clear stale SwiftPM artifacts
        run: |
          rm -rf build/SourcePackages
          rm -rf ~/Library/Caches/org.swift.swiftpm
          rm -rf ~/Library/org.swift.swiftpm

      # -skipMacroValidation works around a false-positive
      # "Macro ... must be enabled before it can be used" graph error
      # that xcodebuild emits on Xcode 26.3 for TCA's macro plugins
      # (ComposableArchitectureMacros, CasePathsMacros, etc.) when the
      # resolved swift-syntax version is ahead of the toolchain's
      # internal expectations. The macros themselves are trusted
      # (TCA, CasePaths, swift-perception, swift-dependencies are all
      # well-known pointfreeco packages), so the security caveat in
      # the flag's help text does not apply.
      - name: Build (iOS Simulator)
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme SmartChatApp \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -derivedDataPath build \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Test (iOS Simulator)
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme SmartChatApp \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -derivedDataPath build \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO
