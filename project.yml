name: SmartChatApp
options:
  bundleIdPrefix: com.smartchat
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    # MARKETING_VERSION is the source of truth for the human-facing version.
    # config/Version.xcconfig mirrors this via $(SMARTCHATAPP_MARKETING_VERSION)
    # and is the path that actually reaches Info.plist at build time.
    # CURRENT_PROJECT_VERSION is overwritten at build time by
    # scripts/inject-build-timestamp.sh (→ .local-version.xcconfig).
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "0"
    # DEVELOPMENT_TEAM and CODE_SIGN_STYLE live in config/Signing.xcconfig
    # (resolved via $(SMARTCHATAPP_*) variables, see config/Signing.xcconfig).
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  OpenClawKit:
    path: ../openclaw/apps/shared/OpenClawKit
  # Pinned to the same version XcodeGen resolves for
  # `MarkdownDisplayView`'s transitive closure (0.8.0). Declared
  # explicitly here so `SmartChatAppTests` can import it for the
  # preprocessor integration test (issue #23) AND so the main
  # `SmartChatApp` target can `import Markdown` from
  # `Core/Utilities/MarkdownToAttributedString.swift` (the
  # swift-markdown AST walker that replaced the third-party
  # `MarkdownDisplayView` / `MarkdownViewTextKit` rendering path
  # on 2026-06-29).
  swift-markdown:
    url: https://github.com/swiftlang/swift-markdown.git
    from: "0.8.0"

targets:
  SmartChatApp:
    type: application
    platform: iOS
    sources:
      - SmartChatApp
    configFiles:
      Debug: config/Signing.xcconfig
      Release: config/Signing.xcconfig
    settings:
      base:
        INFOPLIST_FILE: SmartChatApp/Info.plist
        # PRODUCT_BUNDLE_IDENTIFIER is set in config/Signing.xcconfig.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: OpenClawKit
        product: OpenClawKit
      - package: OpenClawKit
        product: OpenClawProtocol
      - package: OpenClawKit
        product: OpenClawChatUI
      - package: swift-markdown
        product: Markdown
    info:
      path: SmartChatApp/Info.plist
      properties:
        CFBundleName: SmartChatApp
        CFBundleDisplayName: SmartChatApp
        CFBundleIdentifier: com.smartchat.SmartChatApp
        # CFBundleVersion / CFBundleShortVersionString come from
        # MARKETING_VERSION / CURRENT_PROJECT_VERSION in settings.base,
        # which are themselves overridden by config/Version.xcconfig.
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundlePackageType: APPL
        CFBundleExecutable: SmartChatApp
        # Non-standard key for dev-only build display. Resolved at build
        # time from $(SMARTCHATAPP_GIT_SHA) in config/Version.xcconfig.
        # Not surfaced to CFBundleVersion (which must stay a pure int).
        SMARTCHATAPPGitSHA: "$(SMARTCHATAPP_GIT_SHA)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocationWhenInUseUsageDescription: SmartChatApp needs access to your location to provide location-based services.
        NSLocationAlwaysAndWhenInUseUsageDescription: SmartChatApp needs access to your location at all times to provide continuous location-based services.

  SmartChatAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SmartChatAppTests
    configFiles:
      Debug: config/Tests.xcconfig
      Release: config/Tests.xcconfig
    settings:
      base:
        # PRODUCT_BUNDLE_IDENTIFIER is set in config/Tests.xcconfig.
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: SmartChatApp
      # Direct dep on swift-markdown so the integration test in
      # `MarkdownTextPreprocessorIntegrationTests` can parse the
      # preprocessed text and assert the CommonMark hard-break
      # AST node is emitted. swift-markdown is also a transitive
      # dep of `MarkdownDisplayView`, but SwiftPM does not let a
      # target link a transitive product directly — declaring it
      # here pins the same version XcodeGen resolves for the
      # main target's transitive closure.
      - package: swift-markdown
        product: Markdown

schemes:
  SmartChatApp:
    build:
      targets:
        SmartChatApp: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SmartChatAppTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release