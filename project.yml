name: SmartChatApp
options:
  bundleIdPrefix: com.smartchat
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  TCA:
    url: https://github.com/pointfreeco/swift-composable-architecture
    from: "1.9.3"
  OpenClawKit:
    url: https://github.com/caspian9/openclaw
    branch: main
    subpath: apps/shared/OpenClawKit

targets:
  SmartChatApp:
    type: application
    platform: iOS
    sources:
      - SmartChatApp
    settings:
      base:
        INFOPLIST_FILE: SmartChatApp/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.smartchat.SmartChatApp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: TCA
        product: ComposableArchitecture
      - package: OpenClawKit
        product: OpenClawKit
      - package: OpenClawKit
        product: OpenClawProtocol
    info:
      path: SmartChatApp/Info.plist
      properties:
        CFBundleName: SmartChatApp
        CFBundleDisplayName: SmartChatApp
        CFBundleIdentifier: com.smartchat.SmartChatApp
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0.0"
        CFBundlePackageType: APPL
        CFBundleExecutable: SmartChatApp
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  SmartChatAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SmartChatAppTests
    settings:
      base:
        INFOPLIST_FILE: SmartChatAppTests/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.smartchat.SmartChatAppTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(TARGET_BUILD_DIR)/SmartChatApp.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/SmartChatApp
        BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      - target: SmartChatApp
