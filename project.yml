name: SmartChatApp
options:
  bundleIdPrefix: com.smartchat
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "24X2NMFQUY"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  TCA:
    url: https://github.com/pointfreeco/swift-composable-architecture
    from: "1.9.3"
  OpenClawKit:
    path: ../openclaw/apps/shared/OpenClawKit
  MarkdownDisplayView:
    url: https://github.com/zjc19891106/MarkdownDisplayView.git
    from: "1.7.8"

targets:
  SmartChatApp:
    type: application
    platform: iOS
    sources:
      - SmartChatApp
    settings:
      base:
        INFOPLIST_FILE: SmartChatApp/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.smartchat.SmartChatApp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: TCA
        product: ComposableArchitecture
      - package: OpenClawKit
        product: OpenClawKit
      - package: OpenClawKit
        product: OpenClawProtocol
      - package: OpenClawKit
        product: OpenClawChatUI
      - package: MarkdownDisplayView
        product: MarkdownDisplayView
    info:
      path: SmartChatApp/Info.plist
      properties:
        CFBundleName: SmartChatApp
        CFBundleDisplayName: SmartChatApp
        CFBundleIdentifier: com.smartchat.SmartChatApp
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0.0"
        CFBundlePackageType: APPL
        CFBundleExecutable: SmartChatApp
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocationWhenInUseUsageDescription: SmartChatApp needs access to your location to provide location-based services.
        NSLocationAlwaysAndWhenInUseUsageDescription: SmartChatApp needs access to your location at all times to provide continuous location-based services.

  SmartChatAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SmartChatAppTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.smartchat.SmartChatAppTests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: SmartChatApp

schemes:
  SmartChatApp:
    build:
      targets:
        SmartChatApp: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SmartChatAppTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release